# CI ai-dev: тесты скиллов (bun test), типы, документация спеки собирается (--strict), дифф спеки в summary PR;
# на main — публикация docs/spec в ветку spec (в main документации нет). Ветки и PR — параллельно, устаревший прогон PR отменяется;
# прогон main не отменяется (docs/ci-concurrency.md, вариант «CI и деплой в одном workflow»
# — деплоя здесь нет, но правило то же).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # spec-diff: merge-base с origin/main
      - uses: oven-sh/setup-bun@v2
      # нижняя граница для скриптов spec: CI проектов на Node зовёт их без Bun (tests/standards/node-runtime)
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run spec:doc
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with: { name: docs-spec, path: docs/spec/, retention-days: 1 }
      - name: Дифф спеки в summary
        if: github.event_name == 'pull_request'
        run: bun run spec:diff --base "origin/${{ github.base_ref }}" --report .spec-report.xml --full >> "$GITHUB_STEP_SUMMARY"

  # Токен на запись — только здесь: job не ставит зависимости и не идёт на PR. Публикации — по очереди, не отменяются.
  spec-publish:
    if: github.event_name == 'push'
    needs: tests
    runs-on: ubuntu-latest
    permissions: { contents: write }
    concurrency: { group: spec-publish, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v8
        with: { name: docs-spec, path: docs/spec }
      - run: bun run spec:publish
