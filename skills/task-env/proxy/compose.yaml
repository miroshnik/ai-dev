# The machine's proxy (the task-env skill, SKILL.md, «The proxy»): one Traefik per machine routes
# http://<service>.<N>.<project>.localhost to containers of task stacks by their labels. Started by
# `task-env proxy up`. The name — the Compose project and the network — is the same expression as `proxyName` in
# scripts/task-env.ts; tests/capabilities/task-env holds each default `${AI_DEV_PROXY:-…}` here to `PROXY` there.
name: ${AI_DEV_PROXY:-ai-dev-proxy}
services:
  traefik:
    image: traefik:v3.7
    command:
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
      - --entryPoints.web.address=:80
      - --providers.docker=true
      # a container is published only with traefik.enable=true
      - --providers.docker.exposedByDefault=false
      # task containers sit in several networks: the proxy reaches them through its own
      - --providers.docker.network=${AI_DEV_PROXY:-ai-dev-proxy}
      # /ping on the internal entry point :8080 — for the healthcheck, not published
      - --ping=true
    ports:
      # the loopback only: task apps aren't visible on the local network
      - 127.0.0.1:${AI_DEV_PROXY_PORT:-80}:80
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [proxy]
    restart: unless-stopped
    healthcheck:
      test: [CMD, traefik, healthcheck, --ping]
      interval: 30s
      start_period: 30s
      start_interval: 1s
networks:
  proxy:
    # a fixed name: task stacks join it as external
    name: ${AI_DEV_PROXY:-ai-dev-proxy}
